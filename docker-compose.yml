
services:
  postgres:
    image: postgres:16
    container_name: syntrixai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: syntrixai
      POSTGRES_USER: syntrixai
      POSTGRES_PASSWORD: syntrixai_dev
    ports:
      - "5432:5432"
    volumes:
      - syntrixai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntrixai -d syntrixai"]
      interval: 5s
      timeout: 5s
      retries: 5

  
  prometheus:
    image: prom/prometheus:latest
    container_name: syntrix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: syntrix-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    restart: unless-stopped

  
  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    container_name: syntrix-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: syntrix-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./monitoring/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    restart: unless-stopped
  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: syntrix-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped


volumes:
  syntrixai_postgres_data:
  prometheus_data:
  qdrant_storage:
  grafana_data:
